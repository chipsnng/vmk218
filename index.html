<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>218 ВМК МГУ</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="218 ВМК">
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

  <!-- Шапка -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-10 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg text-blue-400">218 Группа</h1>
        <p class="text-xs text-slate-400">ВМК МГУ им. М.В. Ломоносова</p>
      </div>
      <span class="text-xs bg-blue-900/60 text-blue-300 border border-blue-700/50 px-3 py-1 rounded-full">
        Осенний семестр
      </span>
    </div>
  </header>

  <!-- Список дней и пар -->
  <main class="max-w-md mx-auto p-4 space-y-4" id="schedule-container">
    <p class="text-center text-slate-500 text-sm py-8">Загрузка расписания...</p>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    async function loadSchedule() {
      try {
        const response = await fetch('schedule.json');
        const data = await response.json();
        renderSchedule(data);
      } catch (err) {
        document.getElementById('schedule-container').innerHTML = 
          '<p class="text-red-400 text-center">Ошибка загрузки расписания</p>';
      }
    }

    function renderSchedule(data) {
      const container = document.getElementById('schedule-container');
      container.innerHTML = '';

      data.days.forEach(dayData => {
        const dayCard = document.createElement('div');
        dayCard.className = "bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 shadow-md backdrop-blur";

        let lessonsHTML = dayData.lessons.map(lesson => {
          const isLecture = lesson.type === 'Лекция';
          const badgeColor = isLecture 
            ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' 
            : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

          return `
            <div class="my-3 p-3 bg-slate-900/60 rounded-xl border border-slate-800">
              <div class="flex justify-between items-start mb-1">
                <span class="text-xs font-semibold text-slate-400">${lesson.time}</span>
                <span class="text-[10px] px-2 py-0.5 rounded-md border ${badgeColor}">
                  ${lesson.type}
                </span>
              </div>
              <div class="font-semibold text-slate-100 text-base mb-1">${lesson.subject}</div>
              <div class="flex justify-between items-center text-xs text-slate-400 mt-2 pt-2 border-t border-slate-800/80">
                <span>📍 Ауд. ${lesson.room}</span>
                <span>👤 ${lesson.teacher}</span>
              </div>
            </div>
          `;
        }).join('');

        dayCard.innerHTML = `
          <h2 class="font-bold text-slate-200 text-lg mb-2 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
            ${dayData.day}
          </h2>
          ${lessonsHTML}
        `;
        container.appendChild(dayCard);
      });
    }

    loadSchedule();
  </script>
</body>
</html>
